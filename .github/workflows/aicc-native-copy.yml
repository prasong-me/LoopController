name: AICC Native Copy Runtime Preflight

on:
  workflow_dispatch:

jobs:
  native-copy-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install test dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify runtime gate is not silently enabled
        run: |
          if [ "${AICC_NATIVE_COPY_RUNTIME:-0}" = "1" ]; then
            echo "AICC_NATIVE_COPY_RUNTIME must not be enabled on this hosted CI job."
            exit 1
          fi

      - name: Run non-gate preflight
        run: npm run test:native-copy

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: aicc-native-copy-preflight
          path: |
            test-results/
            playwright-report/
