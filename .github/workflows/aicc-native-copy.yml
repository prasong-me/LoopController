name: AICC Native Copy Runtime Gate

on:
  workflow_dispatch:

jobs:
  native-copy-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install X11 clipboard support
        run: sudo apt-get update && sudo apt-get install -y xclip xsel

      - name: Install test dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser runtime coverage
        run: xvfb-run -a env AICC_HEADLESS=0 npm run test:browser-runtime

      - name: Run Native Copy Gate
        run: xvfb-run -a env AICC_HEADLESS=0 AICC_NATIVE_COPY_RUNTIME=1 npm run test:native-copy

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: aicc-native-copy-runtime
          path: |
            test-results/
            playwright-report/
