name: OmniLoop Orchestrator CI
on:
  push:
    paths: ["omniloop-orchestrator/**"]
  pull_request:
    paths: ["omniloop-orchestrator/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: omniloop-orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: omniloop-orchestrator/package.json
      - run: npm install
      - run: npm run build
