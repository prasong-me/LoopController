<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AICC Two-Page Loop Fixture</title>
<style>
body{font:16px system-ui;margin:30px;background:#f4f5f7}
main{max-width:700px;background:#fff;padding:24px;border-radius:16px}
textarea{width:100%;height:90px;box-sizing:border-box}
button{padding:9px 14px;margin:8px 4px 0 0}
#response{white-space:pre-wrap;margin-top:18px;padding:14px;background:#f2f3f5;min-height:80px}
#copy:disabled{opacity:.5}
#trace{white-space:pre-wrap;font:12px ui-monospace,monospace;background:#111;color:#eee;padding:12px;border-radius:8px;margin-top:16px}
</style>
</head>
<body>
<main>
<h1 id="title">Generic Web</h1>
<textarea id="message"></textarea>
<button id="send">Send</button>
<section id="response"></section>
<button id="copy" disabled>Copy</button>
<p id="status">READY</p>
<p id="round"></p>
<pre id="trace" aria-label="copy trace"></pre>
</main>
<script>
(() => {
  const params=new URLSearchParams(location.search);
  const name=params.get('name')||'A';
  title.textContent='Generic Web '+name;
  let timer=null,seq=0;
  const copyTrace=[];

  function recordCopyTrace(event,extra={}){
    copyTrace.push({
      at:new Date().toISOString(),
      type:event?.type||null,
      isTrusted:event?.isTrusted===true,
      userActivation:!!navigator.userActivation?.isActive,
      hasBeenActive:!!navigator.userActivation?.hasBeenActive,
      ...extra
    });
    trace.textContent=JSON.stringify(copyTrace,null,2);
  }

  function renderResponse(text){
    clearInterval(timer);
    response.textContent='';
    copy.disabled=true;
    copy.dataset.copied='false';
    copy.dataset.payload='';
    status.textContent='PROCESSING';
    let i=0;
    const chunks=[text+' | chunk 1',text+' | chunk 2',text+' | chunk 3'];
    timer=setInterval(()=>{
      response.textContent=chunks[i++];
      if(i===chunks.length){
        clearInterval(timer);
        copy.disabled=false;
        status.textContent='READY_TO_COPY';
      }
    },25);
  }

  send.onclick=()=>{
    const v=message.value.trim();
    if(!v) throw new Error('empty message');
    seq++;
    round.textContent='operation '+seq;
    renderResponse(name+' processed: '+v);
  };

  copy.addEventListener('click',async event=>{
    recordCopyTrace(event,{phase:'COPY_CLICK'});
    if(copy.disabled) throw new Error('copy clicked before ready');
    const payload=response.textContent;
    try{
      await navigator.clipboard.writeText(payload);
      copy.dataset.copied='true';
      copy.dataset.payload=payload;
      status.textContent='COPIED';
      recordCopyTrace(event,{phase:'CLIPBOARD_WRITE_RESOLVED',payloadLength:payload.length});
    }catch(error){
      copy.dataset.copied='false';
      status.textContent='COPY_FAILED';
      recordCopyTrace(event,{phase:'CLIPBOARD_WRITE_REJECTED',error:String(error?.name||error)});
      throw error;
    }
  });

  const CHECKPOINT_KEY='aicc-runtime-checkpoint-v1';

  function saveCheckpoint(cp){
    if(!checkpointAllowsOnlyData(cp)) throw new Error('checkpoint contains live runtime data');
    sessionStorage.setItem(CHECKPOINT_KEY,JSON.stringify(cp));
    return cp;
  }

  function getCheckpoint(){
    const raw=sessionStorage.getItem(CHECKPOINT_KEY);
    return raw ? JSON.parse(raw) : null;
  }

  function checkpointAllowsOnlyData(cp){
    if(!cp || typeof cp!=='object' || Array.isArray(cp)) return false;
    const forbidden=new Set(['live_dom','element','window','document','event','function','runtime_ref']);
    const visit=(value,key='')=>{
      if(forbidden.has(key)) return false;
      if(value===null) return true;
      if(typeof value==='string'||typeof value==='number'||typeof value==='boolean') return true;
      if(Array.isArray(value)) return value.every(v=>visit(v));
      if(typeof value==='object') return Object.entries(value).every(([k,v])=>visit(v,k));
      return false;
    };
    return visit(cp);
  }

  function recoverFromCheckpoint(){
    const cp=getCheckpoint();
    if(!cp || !cp.semantic_boundary) return {ok:false,resumed_from_checkpoint:false,restarted_run:false};
    return {...cp,ok:true,resumed_from_checkpoint:true,restarted_run:false};
  }

  window.testApi={
    name,
    paste(v){message.value=v;message.dispatchEvent(new Event('input',{bubbles:true}));status.textContent='PASTED'},
    submit(){send.click()},
    isReadyToCopy(){return !copy.disabled&&response.textContent.trim().length>0},
    snapshot(){return {name,response:response.textContent,status:status.textContent,copied:copy.dataset.copied||'false',seq}},
    getCopyTrace(){return copyTrace.map(x=>({...x}))},
    saveCheckpoint,
    getCheckpoint,
    checkpointAllowsOnlyData,
    recoverFromCheckpoint
  };
})();
</script>
</body>
</html>
